name: Issue 30 P2 RED proof

on:
  push:
    branches:
      - automation/issue30-p2-red

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8b7699305dc8fe24d15723d016f4090ffe64ac69
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: false
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Run focused legacy absence regression
        run: node --experimental-strip-types --test test/issue30-terminal-cleanup-legacy-absent-recovery.test.ts
